<a class="skip-link" href="#main-content" data-i18n="skip">Skip to content</a>
<header id="site-header">
  <div class="container header-inner">
    <a
      class="brand"
      href="{{root}}index.html"
      aria-label="Fanaka Noblewealth Advisory home"
    >
      <img
        class="brand-logo"
        src="{{root}}assets/img/logo.png"
        alt="Fanaka Noblewealth Advisory"
      />
    </a>
    <nav class="main-nav" id="main-nav" aria-label="Main navigation">
      <button class="menu-close" type="button" aria-label="Close menu">
        <span aria-hidden="true">&times;</span>
      </button>
      <a href="{{root}}index.html" data-nav="home" data-i18n="nav.home">Home</a>
      <a href="{{root}}about.html" data-nav="about" data-i18n="nav.about"
        >About</a
      >
      <div class="nav-group">
        <button
          class="services-trigger"
          type="button"
          aria-expanded="false"
          aria-haspopup="true"
          data-i18n="nav.services"
        >
          Services <span aria-hidden="true">⌄</span>
        </button>
        <div class="mega-menu">
          <button class="mega-menu__collapse" type="button">
            Collapse services <span aria-hidden="true">×</span>
          </button>
          <div class="mega-grid" data-service-menu></div>
          <a
            class="card-link"
            href="{{root}}services/index.html"
            data-i18n="nav.allServices"
            >Explore all services →</a
          >
        </div>
      </div>
      <a
        href="{{root}}insights.html"
        data-nav="insights"
        data-i18n="nav.insights"
        >Insights</a
      >
      <a
        href="{{root}}resources.html"
        data-nav="resources"
        data-i18n="nav.resources"
        >Resources</a
      >
      <a href="{{root}}contact.html" data-nav="contact" data-i18n="nav.contact"
        >Contact</a
      >
    </nav>
    <div class="header-actions">
      <a
        class="btn btn--gold header-cta"
        href="{{root}}contact.html#booking"
        data-i18n="cta.bookShort"
        >Book Consultation</a
      >
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="main-nav"
      >
        <span aria-hidden="true">☰</span>
      </button>
    </div>
  </div>
</header>
