<a class="skip-link" href="#main-content" data-i18n="skip">Skip to content</a>
<header id="site-header">
  <div class="container header-inner">
    <a
      class="brand"
      href="{{root}}index.html"
      aria-label="Fanaka Noblewealth Advisory home"
    >
      <svg
        class="brand-mark"
        viewBox="0 0 48 54"
        role="img"
        aria-label="Fanaka crest"
      >
        <path
          d="M24 2 43 10v16c0 12-8 20-19 26C13 46 5 38 5 26V10L24 2Z"
          fill="none"
          stroke="#C9A24B"
          stroke-width="1.5"
        />
        <path d="M32 15H17v24h4V29h10v-4H21v-6h11v-4Z" fill="#E0BE6A" />
        <path d="M24 5v43" stroke="#C9A24B" stroke-opacity=".3" />
      </svg>
      <span
        ><span class="brand-name">FANAKA</span
        ><span class="brand-sub">NOBLEWEALTH ADVISORY</span></span
      >
    </a>
    <nav class="main-nav" id="main-nav" aria-label="Main navigation">
      <a href="{{root}}index.html" data-nav="home" data-i18n="nav.home">Home</a>
      <a href="{{root}}about.html" data-nav="about" data-i18n="nav.about"
        >About</a
      >
      <div class="nav-group">
        <button
          class="services-trigger"
          type="button"
          aria-expanded="false"
          aria-haspopup="true"
          data-i18n="nav.services"
        >
          Services <span aria-hidden="true">⌄</span>
        </button>
        <div class="mega-menu">
          <div class="mega-grid" data-service-menu></div>
          <a
            class="card-link"
            href="{{root}}services/index.html"
            data-i18n="nav.allServices"
            >Explore all services →</a
          >
        </div>
      </div>
      <a
        href="{{root}}insights.html"
        data-nav="insights"
        data-i18n="nav.insights"
        >Insights</a
      >
      <a
        href="{{root}}resources.html"
        data-nav="resources"
        data-i18n="nav.resources"
        >Resources</a
      >
      <a href="{{root}}contact.html" data-nav="contact" data-i18n="nav.contact"
        >Contact</a
      >
      <div class="language-switch mobile-language" aria-label="Language">
        <button type="button" data-language="en" aria-pressed="true">EN</button
        ><span>|</span
        ><button type="button" data-language="sw" aria-pressed="false">
          SW
        </button>
      </div>
    </nav>
    <div class="header-actions">
      <div class="language-switch" aria-label="Language">
        <button type="button" data-language="en" aria-pressed="true">EN</button
        ><span>|</span
        ><button type="button" data-language="sw" aria-pressed="false">
          SW
        </button>
      </div>
      <a
        class="btn btn--gold header-cta"
        href="{{root}}contact.html#booking"
        data-i18n="cta.bookShort"
        >Book Consultation</a
      >
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="main-nav"
      >
        <span aria-hidden="true">☰</span>
      </button>
    </div>
  </div>
</header>
